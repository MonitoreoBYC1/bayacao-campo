<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#452007">
<meta name="description" content="Registro de datos de campo de Bayacao, funciona sin señal.">
<title>Bayacao Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Paleta corporativa Grupo Bayacao ===== */
:root{
  --choco:#452007; --cacao:#4E3227; --dorado:#B8924A; --verde:#5B7F3A;
  --crema:#F7F1E8; --arena:#E6D9C3; --texto:#3A3A3A;
  --ok:#2E7D32; --amb:#F2A900; --err:#C62828; --blanco:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--crema);color:var(--texto);font-family:Calibri,Arial,sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
/* Encabezado */
header.top{position:sticky;top:0;z-index:20;background:var(--choco);color:var(--blanco);display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top .home{background:none;border:0;color:var(--blanco);font-weight:700;font-size:17px;padding:6px 4px;min-height:44px;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .home b{letter-spacing:.06em}
header.top .back{background:var(--dorado);border:0;color:var(--choco);font-weight:700;font-size:16px;border-radius:10px;padding:8px 12px;min-height:44px;white-space:nowrap}
.guia{border-left:5px solid var(--dorado)}
.guia ol{margin:6px 0 0 20px;padding:0}
.guia li{margin:4px 0}
.tile.main{grid-column:1/-1;min-height:96px;border-color:var(--choco);border-width:3px}
.tile.main b{font-size:21px}
.tile.opc{grid-column:1/-1;min-height:64px;opacity:.85}
.net{font-size:14px;font-weight:700;border-radius:999px;padding:6px 10px;white-space:nowrap;border:2px solid var(--blanco)}
.net.on{background:var(--verde);border-color:var(--verde)}
.net.off{background:var(--blanco);color:var(--choco)}
#banner{display:none;background:var(--dorado);color:var(--choco);font-weight:700;padding:10px 12px;border:0;width:100%;text-align:left;min-height:48px}
#banner.show{display:block}
main{max-width:640px;margin:0 auto;padding:12px 12px 200px}
footer.pie{text-align:center;font-size:13px;color:var(--cacao);padding:8px 12px 190px}
h2.ttl{color:var(--choco);font-size:22px;margin:4px 0 10px}
h3{color:var(--cacao);font-size:18px;margin:0 0 10px}
h4{color:var(--cacao);font-size:16px;margin:14px 0 8px;border-top:1px solid var(--arena);padding-top:10px}
.card{background:var(--blanco);border:1px solid var(--arena);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--cacao);font-size:14px}
.small{font-size:14px}
/* Campos */
.fld{display:block;margin-bottom:10px;min-width:0}
.fld>span{display:block;font-weight:700;font-size:15px;margin-bottom:4px;color:var(--cacao)}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;background:var(--arena);border:2px solid var(--arena);border-radius:8px;padding:8px 10px;font-size:18px;color:var(--texto)}
.fld textarea{min-height:110px;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--dorado);background:var(--blanco)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-st{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px}
/* Contadores − / + */
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:4px;align-items:stretch}
.stepper input{text-align:center;font-weight:700;font-size:20px;padding:4px;min-width:0}
.stp{min-height:48px;border-radius:8px;border:2px solid var(--choco);background:var(--blanco);color:var(--choco);font-size:26px;font-weight:700;line-height:1;padding:0}
.stp:active{background:var(--choco);color:var(--blanco)}
/* Botones de selección única / múltiple */
.seg,.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chips button{min-height:48px;min-width:48px;padding:6px 12px;border-radius:8px;border:2px solid var(--arena);background:var(--arena);font-size:16px;font-weight:700;color:var(--texto)}
.seg button.sel,.chips button.sel{background:var(--choco);border-color:var(--choco);color:var(--blanco)}
.chips button.sel::before{content:"✓ "}
/* Botones */
.btn{min-height:48px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:17px;border:2px solid var(--choco)}
.btn.pri{background:var(--choco);color:var(--blanco)}
.btn.pri.warn{background:var(--amb);border-color:var(--amb);color:var(--texto)}
.btn.sec{background:var(--blanco);color:var(--choco)}
.btn.gold{background:var(--dorado);border-color:var(--dorado);color:var(--choco)}
.btn.danger{background:var(--blanco);border-color:var(--err);color:var(--err)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:15px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
/* Barra inferior fija */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--blanco);border-top:3px solid var(--dorado);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#bar:empty{display:none}
#bar .btns{display:flex;gap:8px;max-width:640px;margin:0 auto}
#bar .btns .btn{flex:1}
#bar .btns .btn.pri{flex:2}
#msgs{max-width:640px;margin:0 auto;max-height:38vh;overflow:auto}
.msg{border-left:6px solid;padding:8px 10px;margin-bottom:6px;border-radius:6px;font-weight:700;font-size:15px;background:var(--crema)}
.msg.err{border-color:var(--err);color:var(--err)}
.msg.warn{border-color:var(--amb);color:var(--texto)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.msg .btn{margin-top:6px}
/* Inicio */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--blanco);border:2px solid var(--arena);border-radius:14px;padding:14px 12px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.tile b{color:var(--choco);font-size:18px;line-height:1.2}
.tile small{color:var(--cacao);font-size:14px}
.tile .bdg{align-self:flex-start}
.tile.clima{border-color:var(--verde)}
.tile.clima b{color:var(--verde)}
.bdg{display:inline-block;border-radius:999px;padding:2px 8px;font-size:13px;font-weight:700;background:var(--arena);color:var(--choco)}
.bdg.gold{background:var(--dorado);color:var(--choco)}
.bdg.ok{background:var(--verde);color:var(--blanco)}
.bdg.warn{background:var(--amb);color:var(--texto)}
.bdg.err{background:var(--err);color:var(--blanco)}
/* Listas */
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--arena);padding:10px 0;display:flex;gap:8px;align-items:center}
.list li:first-child{border-top:0}
.list .info{flex:1;min-width:0}
.list .info b{display:block;color:var(--choco);overflow-wrap:anywhere}
.list .info small{color:var(--cacao);font-size:14px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1;min-width:90px;background:var(--crema);border-left:5px solid var(--dorado);border-radius:8px;padding:8px}
.kpi b{display:block;font-size:22px;color:var(--choco)}
.kpi span{font-size:13px;color:var(--cacao)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;min-height:48px;border-radius:10px;border:2px solid var(--choco);background:var(--blanco);color:var(--choco);font-weight:700;padding:6px 8px;white-space:nowrap}
.tabs button.sel{background:var(--choco);color:var(--blanco)}
.pod{border:2px solid var(--arena);border-radius:10px;padding:10px;margin-bottom:10px}
.pod.venc{border-color:var(--amb)}
.pod-h b{color:var(--choco)}
.pod-h small{display:block;color:var(--cacao)}
.alerta{background:var(--err);color:var(--blanco);font-weight:700;padding:12px;border-radius:10px;margin-bottom:12px}
.editing{background:var(--dorado);color:var(--choco);font-weight:700;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.live{background:var(--crema);border-left:5px solid var(--verde);padding:8px 10px;border-radius:8px;font-weight:700;margin-top:10px}
.calc{font-size:22px;font-weight:700;color:var(--choco)}
/* Toast y modal */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:60;background:var(--cacao);color:var(--blanco);padding:12px 16px;border-radius:10px;font-weight:700;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;text-align:center}
#toast.show{display:block}
#toast.ok{background:var(--verde)}
#toast.err{background:var(--err)}
.ovl{position:fixed;inset:0;z-index:80;background:rgba(58,58,58,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--blanco);border-radius:14px;padding:16px;width:100%;max-width:420px;border-top:6px solid var(--choco)}
.dlg h3{margin-top:0}
.dlg .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dlg .btns .btn{flex:1}
.dlg.danger{border-top-color:var(--err)}
.hidden{display:none !important}
/* v1.1 · Ficha del árbol y límites */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg.col{flex-direction:column}
.seg.col button{text-align:left;width:100%}
.tile.wide{grid-column:1/-1;min-height:84px}
.sug{border:2px solid var(--dorado);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--crema)}
.sug b{color:var(--choco);font-size:18px}
.sug small{display:block;color:var(--cacao);font-size:14px;overflow-wrap:anywhere}
.fbdg{margin:0 0 10px}
.fbdg .btn{width:100%;text-align:left}
.fbdg .btn.ok{background:var(--crema);border-color:var(--verde);color:var(--verde)}
@media (max-width:370px){ .grid2{grid-template-columns:1fr} .home-grid{gap:8px} }
</style>
</head>
<body>
<header class="top">
  <button class="back" id="hdrBack" type="button" hidden>‹ Inicio</button>
  <button class="home" id="hdrHome" aria-label="Ir al inicio"><b>BAYACAO</b> · Registro de campo</button>
  <span class="net off" id="net">Sin señal</span>
</header>
<button id="banner" type="button"></button>
<main id="main"><p class="muted">Cargando…</p></main>
<footer class="pie">Grupo Bayacao – Uso interno · v1.3</footer>
<div id="bar"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="./xlsx.full.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Bayacao · Registro de campo (PWA sin conexión) — v1.3
   Un solo archivo: utilidades, base de datos, módulos, exportación.
   ===================================================================== */

const APP_VERSION = '1.3';
const DATA_STORES = ['conteo', 'pods', 'visits', 'fenologia', 'clima', 'lotes', 'fichas'];
const DB_VERSION = 2; // v1.1: nuevo almacén «fichas» (los existentes no se tocan)
const KEY_STORES = ['settings', 'drafts'];

// ---------- Listas fijas ----------
// Diseño de muestreo (20/10/2026): 14 parcelas × 2 puntos (M1, M2). Coordenadas del mapa de muestreo.
const PUNTOS_MUESTREO = {"P01.01": [[18.675034, -69.603437], [18.673419, -69.601505]], "P01.02": [[18.677079, -69.604079], [18.67289, -69.597984]], "P01.03": [[18.678418, -69.603287], [18.674213, -69.59717]], "P01.04": [[18.679551, -69.602022], [18.675535, -69.59618]], "P01.06": [[18.68128, -69.598109], [18.679367, -69.595507]], "P01.07": [[18.681006, -69.596114], [18.678238, -69.591751]], "P01.08": [[18.681782, -69.593968], [18.678209, -69.589028]], "P01.09": [[18.682323, -69.592196], [18.681822, -69.588764]], "P01.10": [[18.682649, -69.595635], [18.683765, -69.595211]], "P01.12": [[18.676275, -69.593507], [18.674622, -69.594289]], "P01.16": [[18.676849, -69.589301], [18.675609, -69.589577]], "P02.02": [[18.685441, -69.60464], [18.685572, -69.6031]], "P02.08": [[18.6856, -69.6096], [18.685287, -69.611919]], "P02.09": [[18.686136, -69.608056], [18.6873, -69.609344]]};
const DEF_PARCELAS = Object.keys(PUNTOS_MUESTREO);
const OLD_PARCELAS = []; // lista por defecto de v1.0–v1.2, para migrar
for (let i = 1; i <= 16; i++) OLD_PARCELAS.push('P01.' + String(i).padStart(2, '0'));
for (let i = 1; i <= 9; i++) OLD_PARCELAS.push('P02.' + String(i).padStart(2, '0'));
// Código de campo del punto: P01.06 + punto 1 → B1P6M1
function codigoPunto(parcela, punto) {
  const m = /^P0(\d)\.(\d+)$/.exec(parcela || ''); if (!m || !punto) return '';
  return `B${m[1]}P${parseInt(m[2], 10)}M${punto}`;
}
function coordPunto(parcela, punto) { const p = PUNTOS_MUESTREO[parcela]; return p && p[punto - 1] ? p[punto - 1] : null; }
function distM(a, b) { const R = 6371000, t = Math.PI / 180; const dLa = (b[0] - a[0]) * t, dLo = (b[1] - a[1]) * t;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const DEF_MATERIALES = ['ICS-95', 'ICS-1', 'ML-105', 'ML-106', 'UF-677', 'UF-221', 'UF-613', 'Semilla/híbrido', 'Desconocido', 'Otro'];
const DEF_ESTACIONES = ['Finca Bayaguana – Pluviómetro 1'];
const CAUSAS_MUERTE = ['Cherelle wilt', 'Mazorca negra', 'Ratas', 'Carpintero/pájaros', 'Insectos', 'Sospecha de monilia', 'Caída/arrancada', 'Otra'];
const MONILIA = 'Sospecha de monilia';
const EVENTOS = [['viento', 'Viento fuerte'], ['tormenta', 'Tormenta'], ['sequia', 'Sequía visible'], ['inundacion', 'Inundación']];
const ESTADOS_POD = ['Viva', 'Muerta', 'Cosechada'];
// Clases de tamaño: límites configurables en Ajustes (límite inferior 2.5 cm fijo)
const LIM_MIN = 2.5;
const DEF_LIMITES = [7, 14, 21];
const LIM_V10 = [2.5, 7, 14, 21]; // límites de la v1.0 (registros sin «limites» guardado)
let CLASES = [], SANAS = [];
const fmtCm = n => String(Math.round(Number(n) * 10) / 10);
const curLim = () => [LIM_MIN, ...S.limites];
const limStr = l => (l || LIM_V10).map(fmtCm).join('/');
function applyLimits() {
  const [a, b, c] = (S.limites && S.limites.length === 3) ? S.limites : DEF_LIMITES;
  const a1 = Math.round((a + 0.1) * 10) / 10, b1 = Math.round((b + 0.1) * 10) / 10;
  CLASES = [['MP', `${fmtCm(LIM_MIN)}–${fmtCm(a)} cm`, LIM_MIN, a], ['P', `${fmtCm(a1)}–${fmtCm(b)} cm`, a1, b], ['M', `${fmtCm(b1)}–${fmtCm(c)} cm`, b1, c], ['G', `>${fmtCm(c)} cm`, c + 0.01, 40]];
  SANAS = [['mp', 'MP ' + CLASES[0][1]], ['p', 'P ' + CLASES[1][1]], ['m', 'M ' + CLASES[2][1]], ['g', 'G ' + CLASES[3][1]], ['mad', 'Maduras / pintonas']];
}
const DANADAS = [['negra', 'Mazorca negra'], ['ratas', 'Ratas'], ['pajaros', 'Carpintero / pájaros'], ['insectos', 'Insectos'], ['otra', 'Otra']];
const ESC_CHER = [[0, '0 Ninguno'], [1, '1 Pocos (1–10)'], [2, '2 Muchos (>10)']];
const FENO = [
  { k: 'cherSanos', l: 'Cherelles sanos (<2.5 cm)', o: ESC_CHER },
  { k: 'cherMarch', l: 'Cherelles marchitos', o: ESC_CHER },
  { k: 'flor', l: 'Floración', o: [[0, '0 Nada'], [1, '1 Poca'], [2, '2 Media'], [3, '3 Abundante']] },
  { k: 'brot', l: 'Brotación nueva', o: [[1, 'Sí'], [0, 'No']] },
  { k: 'defol', l: 'Defoliación', o: [[0, '0 Ninguna'], [1, '1 Leve'], [2, '2 Moderada'], [3, '3 Severa']] },
  { k: 'muerteReg', l: 'Síntomas de muerte regresiva', o: [[1, 'Sí'], [0, 'No']] },
  { k: 'vigor', l: 'Vigor', o: [[1, '1 Bajo'], [2, '2 Medio'], [3, '3 Alto']] }
];
const DIAS_VENCIDA = 16;
const CINTAS = ['Rojo', 'Azul', 'Amarillo', 'Blanco', 'Verde', 'Negro', 'Naranja', 'Morado', 'Otro'];

// ---------- Utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = (n, l = 2) => String(n).padStart(l, '0');
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function isoLocal(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function today() { return isoLocal(new Date()); }
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoLocal(new Date(y, m - 1, d + n)); }
function fmtD(iso) { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y}`; }
function fmtDT(iso) { if (!iso) return ''; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysSince(iso) {
  if (!iso) return 0;
  const [y, m, d] = iso.split('-').map(Number); const t = new Date();
  return Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(y, m - 1, d)) / 864e5);
}
function excelSerial(iso) { const [y, m, d] = iso.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; }
function pnum(v) { // número o null (vacío) o NaN (inválido); acepta coma decimal
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace(',', '.'); if (s === '') return null;
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN; // rechaza 0x10, 1e2, letras
  const n = Number(s); return Number.isFinite(n) ? n : NaN;
}
function segNum(v) { return (v === '' || v === null || v === undefined) ? null : Number(v); }
function nz(v) { return v === null || v === undefined ? '' : v; }
function uuid() {
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* respaldo */ }
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256); }
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function sumKeys(r, keys) { return keys.reduce((a, k) => a + (Number(r[k]) || 0), 0); }
const sanasDe = r => sumKeys(r, SANAS.map(x => x[0]));
const danadasDe = r => sumKeys(r, DANADAS.map(x => x[0]));

// ---------- Base de datos (IndexedDB con respaldo en memoria) ----------
const DB = {
  db: null, mem: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('bayacao_campo', DB_VERSION);
        r.onupgradeneeded = () => {
          // Solo crea los almacenes que faltan: los datos existentes nunca se tocan
          const d = r.result;
          DATA_STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
          KEY_STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'key' }); });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('Base de datos bloqueada'));
      });
    } catch (e) {
      console.warn('IndexedDB no disponible, usando memoria:', e);
      this.mem = {}; [...DATA_STORES, ...KEY_STORES].forEach(s => { this.mem[s] = new Map(); });
    }
  },
  keyOf(store, o) { return KEY_STORES.includes(store) ? o.key : o.id; },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode); const st = t.objectStore(store);
        let out; const r = fn(st);
        if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  get(store, key) { if (this.mem) return Promise.resolve(clone(this.mem[store].get(key))); return this._tx(store, 'readonly', s => s.get(key)); },
  all(store) { if (this.mem) return Promise.resolve(Array.from(this.mem[store].values()).map(clone)); return this._tx(store, 'readonly', s => s.getAll()).then(r => r || []); },
  put(store, o) { if (this.mem) { this.mem[store].set(this.keyOf(store, o), clone(o)); return Promise.resolve(); } return this._tx(store, 'readwrite', s => s.put(o)); },
  putMany(store, arr) {
    if (!arr.length) return Promise.resolve();
    if (this.mem) { arr.forEach(o => this.mem[store].set(this.keyOf(store, o), clone(o))); return Promise.resolve(); }
    return this._tx(store, 'readwrite', s => { arr.forEach(o => s.put(o)); return null; });
  },
  del(store, key) { if (this.mem) { this.mem[store].delete(key); return Promise.resolve(); } return this._tx(store, 'readwrite', s => s.delete(key)); },
  delMany(store, keys) {
    if (!keys.length) return Promise.resolve();
    if (this.mem) { keys.forEach(k => this.mem[store].delete(k)); return Promise.resolve(); }
    return this._tx(store, 'readwrite', s => { keys.forEach(k => s.delete(k)); return null; });
  }
};

function gate(E, W) {
  renderMsgs(E, W);
  if (E.length) { pendingWarn = null; resetSaveBtn(); toast('Corrige los campos en rojo', 'err'); return false; }
  if (W.length) {

function vInt(E, val, label, min, max, req) {

}

// Lee todos los valores de un contenedor
function getVals(root) {
  const o = {};
  $$('input[name],select[name],textarea[name]', root).forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  $$('.seg[data-name]', root).forEach(g => { const s = $('button.sel', g); o[g.dataset.name] = s ? s.dataset.val : ''; });
  $$('.chips[data-name]', root).forEach(g => { o[g.dataset.name] = $$('button.sel', g).map(b => b.dataset.val); });
  return o;
}
// Escribe valores en un contenedor (sin disparar eventos)
function setVals(root, obj) {
  Object.entries(obj || {}).forEach(([k, v]) => {
    const el = root.querySelector(`[name="${k}"]`);
    if (el) {
      if (el.type === 'checkbox') el.checked = !!v;
      else {
        const val = v === null || v === undefined ? '' : String(v);
        if (el.tagName === 'SELECT' && val && !$$('option', el).some(op => op.value === val)) {
          const op = document.createElement('option'); op.value = val; op.textContent = val; el.appendChild(op);
        }
        el.value = val;
      }
      return;
    }
    const g = root.querySelector(`.seg[data-name="${k}"]`);
    if (g) { $$('button', g).forEach(b => b.classList.toggle('sel', v !== null && v !== undefined && v !== '' && b.dataset.val === String(v))); return; }
    const c = root.querySelector(`.chips[data-name="${k}"]`);
    if (c) { const arr = Array.isArray(v) ? v.map(String) : []; $$('button', c).forEach(b => b.classList.toggle('sel', arr.includes(b.dataset.val))); }
  });
}

function bindGlobalEvents() {
  const main = $('#main');
  // 'input' para campos de texto/fecha; 'change' solo para listas (evita disparar dos veces)
  main.addEventListener('input', e => { if (e.target.name && e.target.tagName !== 'SELECT') formChanged(e.target.name); });
  main.addEventListener('change', e => { if (e.target.name && e.target.tagName === 'SELECT') formChanged(e.target.name); });
  main.addEventListener('click', e => {
    const st = e.target.closest('[data-step]');
    if (st) {
      const inp = $('input', st.parentElement); const mn = Number(inp.dataset.min), mx = Number(inp.dataset.max);
      const step = Number(st.dataset.step); let n = pnum(inp.value);
      if (n === null || Number.isNaN(n)) n = step > 0 ? Math.max(mn, 1) : mn; // vacío: + da 1, − da el mínimo
      else n = Math.round(n) + step;
      inp.value = Math.max(mn, Math.min(mx, n)); formChanged(inp.name); return;
    }
    const sb = e.target.closest('.seg button');
    if (sb) { const g = sb.parentElement; const was = sb.classList.contains('sel'); $$('button', g).forEach(b => b.classList.remove('sel')); if (!was) sb.classList.add('sel'); formChanged(g.dataset.name); return; }
    const cb = e.target.closest('.chips button');
    if (cb) { cb.classList.toggle('sel'); formChanged(cb.parentElement.dataset.name); }
  });

  $('#hdrBack').addEventListener('click', () => go('#/inicio'));
  $('#banner').addEventListener('click', () => go('#/exportar'));
  window.addEventListener('online', updateStatus);

}

async function saveConteo() {
  if (!await requireUser()) return;
  const frm = $('#frm'); const v = getVals(frm); const E = [], W = [];
  const ronda = v.ronda.trim();
  if (!ronda) E.push('Ronda: obligatoria'); else if (!/^\d{4}-\d{2}$/.test(ronda)) W.push({ msg: `La ronda «${ronda}» no tiene formato AAAA-MM. ¿Confirmar?` });
  if (!v.fecha) E.push('Fecha: obligatoria'); else if (v.fecha > today()) W.push({ msg: 'La fecha está en el futuro. ¿Confirmar?' });
  if (!v.parcela) E.push('Parcela: elige una');
  const punto = vInt(E, v.punto, 'Punto #', 1, 20, true);
  const arbol = vInt(E, v.arbol, 'Árbol #', 1, 999, true);
  if (!v.material) E.push('Material: elige uno');
  const rec = {};
  rec.prod = vInt(E, v.prod, 'Árboles productivos', 0, 300, false);
  rec.improd = vInt(E, v.improd, 'Árboles improductivos', 0, 300, false);
  rec.fallas = vInt(E, v.fallas, 'Fallas / muertos', 0, 300, false);
  [...SANAS, ...DANADAS].forEach(([k, l]) => { rec[k] = vInt(E, v[k], l, 0, 300, false) ?? 0; });
  rec.sobre25 = vInt(E, v.sobre25, 'Mazorcas sobre 2.5 m', 0, 300, false);
  const s = sanasDe(rec);
  if (s > 120) W.push({ msg: `Total de sanas del árbol = ${s} (más de 120). ¿Confirmar?` });
  if (!E.length) {
    const dup = (await DB.all('conteo')).find(r => r.id !== C.editId && r.ronda === ronda && r.parcela === v.parcela && r.punto === punto && r.arbol === arbol);
    if (dup) W.push({ msg: `Ya existe el árbol ${arbol} en ${v.parcela}, punto ${punto}, ronda ${ronda}.`, action: { label: 'Editar el existente', fn: () => { loadConteoRow(dup); formChanged(''); } } });
  }
  if (!gate(E, W)) return;

  const old = C.editId ? await DB.get('conteo', C.editId) : null;
  const r = Object.assign(old || {}, rec, {
    ronda, fecha: v.fecha, parcela: v.parcela, punto, arbol, material: v.material,
    lat: pnum(v.lat), lon: pnum(v.lon), prec: pnum(v.prec), nota: (v.nota || '').trim()
  });
  FENO.forEach(f => { r[f.k] = segNum(v[f.k]); });
  // Límites de tamaño vigentes al contar (al editar se conservan los originales)
  if (!Array.isArray(r.limites)) r.limites = old ? LIM_V10.slice() : curLim();
  stamp(r);
  try {
    await DB.put('conteo', r);
    // Mantener el encabezado de la visita igual en todos los árboles del punto
    const others = (await pointRows(v)).filter(o => o.id !== r.id);
    const upd = others.filter(o => ['fecha', 'lat', 'lon', 'prec', 'prod', 'improd', 'fallas'].some(k => o[k] !== r[k]))
      .map(o => { ['fecha', 'lat', 'lon', 'prec', 'prod', 'improd', 'fallas'].forEach(k => { o[k] = r[k]; }); return stamp(o); });
    await DB.putMany('conteo', upd);
  } catch (e) { console.error(e); toast('Error al guardar: ' + e.message, 'err'); return; }
  S.ultimaRonda = ronda; S.ultimoMaterial = v.material; saveSettings();
  toast(`Árbol ${arbol} guardado ✓`, 'ok');
  C.editId = null; clearTree(); await setNextTree(); editBanner(); await refreshPoint(); await saveDraft(); updateStatus();
  $('#treeCard').scrollIntoView({ behavior: 'smooth' });
}

async function undoLastVisit(podId) {
  const pod = await DB.get('pods', podId); if (!pod) return;
  const vs = (await DB.all('visits')).filter(x => x.podId === podId).sort((a, b) => (a.fecha + a.creado).localeCompare(b.fecha + b.creado));
  const last = vs[vs.length - 1]; if (!last) { toast('Esta mazorca no tiene revisiones'); return; }
  if (!await confirmar('Deshacer última revisión', `${esc(pod.codigo)}: se borrará la revisión del ${fmtD(last.fecha)} (${ESTADOS_POD[last.estado]}) y la mazorca volverá a su estado anterior.`, 'Deshacer', true)) return;
  const prev = last.prev || { estado: 0, causa: '', fechaUltimo: vs.length > 1 ? vs[vs.length - 2].fecha : null, largoUltimo: null };
  Object.assign(pod, prev); stamp(pod);
  await DB.put('pods', pod); await DB.del('visits', last.id);
  toast('Revisión deshecha'); if ($('#rev')) { await fillArbolSelect(); setVals($('#rev'), { arbol: pod.arbol }); await renderPodList(); } updateStatus();
}

  if (!v.parcela) E.push('Parcela: elige una');
  if (!v.arbol) E.push('Árbol: elige uno');
  if (!v.fecha) E.push('Fecha de revisión: obligatoria'); else if (v.fecha > today()) W.push({ msg: 'La fecha de revisión está en el futuro. ¿Confirmar?' });
  const arbol = Number(v.arbol);
  const vivas = (await DB.all('pods')).filter(p => p.parcela === v.parcela && p.arbol === arbol && p.estado === 0);
  const changes = [];
  for (const p of vivas) {
    const st = v['st_' + p.id]; if (st === '' || st === undefined) continue;
    const ch = { pod: p, estado: Number(st), causa: '', largo: null };
    if (v.fecha && v.fecha < p.fechaMarcaje) E.push(`${p.codigo}: la fecha de revisión es anterior al marcaje (${fmtD(p.fechaMarcaje)})`);
    else if (v.fecha && p.fechaUltimo && v.fecha < p.fechaUltimo) W.push({ msg: `${p.codigo}: fecha anterior a su última revisión (${fmtD(p.fechaUltimo)}). ¿Confirmar?` });
    if (ch.estado === 0) {
      ch.largo = vDec(E, v['lg_' + p.id], `${p.codigo} largo`, 1, 40, false);
      if (ch.largo !== null && p.largoUltimo && ch.largo < p.largoUltimo - 1) W.push({ msg: `${p.codigo}: el largo (${ch.largo} cm) es menor que el anterior (${p.largoUltimo} cm). ¿Confirmar?` });
    }
    if (ch.estado === 1) { ch.causa = v['cz_' + p.id] || ''; if (!ch.causa) E.push(`${p.codigo}: elige la causa de muerte`); }
    changes.push(ch);
  }
  const feno = {}; FENO.forEach(f => { feno[f.k] = segNum(v[f.k]); });
  const hasFeno = FENO.some(f => feno[f.k] !== null);
  if (v.parcela && v.arbol && !changes.length && !hasFeno) E.push('Marca el estado de al menos una mazorca o la fenología');
  if (changes.length && changes.length < vivas.length) W.push({ msg: `${vivas.length - changes.length} mazorca(s) viva(s) de este árbol quedan sin revisar. ¿Guardar así?` });
  if (!gate(E, W)) return;

  const visits = [], pods = [];
  for (const ch of changes) {
    const p = ch.pod;
    const prev = { estado: p.estado, causa: p.causa || '', fechaUltimo: p.fechaUltimo || null, largoUltimo: p.largoUltimo ?? null };
    visits.push(stamp({ podId: p.id, codigo: p.codigo, parcela: p.parcela, arbol: p.arbol, fecha: v.fecha, estado: ch.estado, causa: ch.causa, largo: ch.largo, prev }));
    p.estado = ch.estado; p.causa = ch.causa; p.fechaUltimo = v.fecha; if (ch.largo !== null) p.largoUltimo = ch.largo;
    pods.push(stamp(p));
  }
  try {
    await DB.putMany('visits', visits); await DB.putMany('pods', pods);
    if (hasFeno) await DB.put('fenologia', stamp(Object.assign({ fecha: v.fecha, parcela: v.parcela, arbol, origen: 'PSM' }, feno)));
  } catch (e) { console.error(e); toast('Error al guardar: ' + e.message, 'err'); return; }
  const mon = changes.some(c => c.causa === MONILIA);
  toast(`Revisión guardada ✓ (${changes.length} mazorcas${hasFeno ? ' + fenología' : ''})`, 'ok');
  if (mon) await modal({ title: '⚠ Sospecha de monilia registrada', danger: true, body: '<p class="alerta">Reportar de inmediato a gerencia agrícola y al Departamento de Cacao. Tomar muestra y aislar.</p>', buttons: [{ label: 'Entendido', val: true, cls: 'pri' }] });
  await dropDraft('borrador_psm');
  await psmRevision({ parcela: v.parcela, arbol: String(arbol), fecha: v.fecha });
  updateStatus();
}

async function nextPodN(parcela, arbol) {
  const ns = (await DB.all('pods')).filter(p => p.parcela === parcela && p.arbol === arbol).map(p => p.n || 0);

}
async function refreshMarcar() {

}
async function saveMarcar() {
  if (!await requireUser()) return;

  const editing = P.editPod ? await DB.get('pods', P.editPod) : null;
  if (!v.parcela) E.push('Parcela: elige una');

async function saveLote() {

  const humedad = vDec(E, v.humedad, 'Humedad final', 0, 100, false);
  if (v.fechaSalida && v.fechaEntrada && v.fechaSalida < v.fechaEntrada) E.push('La salida de secado no puede ser antes de la entrada');
  if (kgBaba && kgSeco) {

    if (f < 0.30 || f > 0.45) W.push({ msg: `Factor ${f.toFixed(3)} fuera del rango esperado 0.30–0.45. ¿Confirmar?` });
  }
  if ((kgSeco !== null) !== !!v.fechaSalida) W.push({ msg: 'Para cerrar el lote faltan fecha de salida o kg secos; quedará ABIERTO. ¿Confirmar?' });
  if (codigo && !E.length) {
    const dup = (await DB.all('lotes')).find(r => r.id !== L.editId && r.codigo.toLowerCase() === codigo.toLowerCase());
    if (dup) W.push({ msg: `Ya existe el lote ${dup.codigo}.`, action: { label: 'Editar el existente', fn: () => { loadLote(dup); formChanged(''); } } });
  }
  if (!gate(E, W)) return;
  const old = L.editId ? await DB.get('lotes', L.editId) : null;
  const cerrado = !!(v.fechaSalida && kgSeco);

    if (m.prom !== null && k.L !== null && Math.abs(m.prom - k.L) <= 1.5) { s += 1.5; why.push(`largo ${fmtCm(m.prom)} ≈ ${k.L} cm`); }

function buildSheet(name, rows) {
  const ws = XLSX.utils.aoa_to_sheet([SHEETS[name], ...rows]);
  (DATE_COLS[name] || []).forEach(c => {
    rows.forEach((row, i) => {
      const v = row[c]; if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      ws[XLSX.utils.encode_cell({ r: i + 1, c })] = { t: 'n', v: excelSerial(v), z: 'dd/mm/yyyy' };
    });
  });
  ws['!cols'] = SHEETS[name].map((h, c) => ({ wch: Math.min(40, Math.max(h.length + 2, ...rows.slice(0, 200).map(r => String(r[c] ?? '').length + 1))) }));
  if (rows.length) ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: SHEETS[name].length - 1 } }) };
  return ws;
}
function buildWorkbook(rows, scope) {
  const wb = XLSX.utils.book_new(); const now = new Date();
  Object.keys(SHEETS).forEach(n => XLSX.utils.book_append_sheet(wb, buildSheet(n, rows[n]), n));
  const info = [['Campo', 'Valor'], ['Dispositivo', S.dispositivo], ['Registrador', S.registrador], ['Fecha de exportación', null], ['Versión de la app', APP_VERSION], ['Alcance', scope === 'todo' ? 'Todo' : 'Solo no exportados'],

  const ws = XLSX.utils.aoa_to_sheet(info);
  ws['B4'] = { t: 'n', v: (now.getTime() - now.getTimezoneOffset() * 60000 - Date.UTC(1899, 11, 30)) / 864e5, z: 'dd/mm/yyyy hh:mm' };
  ws['!cols'] = [{ wch: 36 }, { wch: 40 }];

}
// Compartir (WhatsApp, correo, OneDrive) o descargar
async function shareOrDownload(blob, fname, title) {
  const file = new File([blob], fname, { type: blob.type });
  try {
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title, text: title });
      return 'shared';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return 'aborted';
    console.warn('share falló, se descarga', e);
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return 'downloaded';
}

async function doExport() {
  if (!await requireUser()) return;
  if (typeof XLSX === 'undefined') { toast('Falta la librería de Excel (xlsx.full.min.js)', 'err'); return; }
  const scope = getVals($('#main')).scope || 'pend';
  const data = await collectExport(scope);
  if (!data.total) { toast(scope === 'pend' ? 'No hay registros sin exportar' : 'No hay registros', 'err'); return; }
  const b = $('#btnSave'); b.disabled = true; b.textContent = 'Generando…';
  try {
    const wb = buildWorkbook(data.rows, scope); const d = new Date();
    const fname = `Bayacao_campo_${S.dispositivo}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.xlsx`;
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
    const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const res = await shareOrDownload(blob, fname, 'Datos de campo Bayacao');
    if (res === 'aborted') { toast('Envío cancelado; nada se marcó como exportado'); return; }
    const ok = await modal({ title: '¿Se envió bien?', body: `<p>Archivo <b>${esc(fname)}</b> con ${data.total} registros.</p><p>Responde «Sí» solo si llegó a su destino (WhatsApp, correo, OneDrive).</p>`, buttons: [{ label: 'No', val: false, cls: 'sec' }, { label: 'Sí, se envió', val: true, cls: 'pri' }] });
    if (ok) {
      const now = new Date().toISOString();
      for (const s of DATA_STORES) {
        const set = new Set(data.ids[s]); const recs = (await DB.all(s)).filter(r => set.has(r.id));
        recs.forEach(r => { r.exportado = true; r.fechaExport = now; });
        await DB.putMany(s, recs);
      }
      S.ultimaExport = now; await saveSettings();
      toast(`${data.total} registros marcados como exportados ✓`, 'ok');
    } else toast('No se marcó nada; puedes volver a exportar');
  } catch (e) { console.error(e); toast('Error al exportar: ' + e.message, 'err'); }
  finally { await route(); }
}

  $('#btnReg').addEventListener('click', async () => { const v = $('#inReg').value.trim(); if (!v) { toast('Escribe un nombre', 'err'); return; } S.registrador = v; await saveSettings(); toast('Nombre guardado ✓', 'ok'); go('#/inicio'); });

  });
  // Límites de tamaño
  const limVals = () => { const v = getVals($('#main')); return ['lim1', 'lim2', 'lim3'].map(k => pnum(v[k])); };
  const limCheck = l => {
    if (l.some(n => n === null || Number.isNaN(n))) return 'Escribe los tres límites (números).';
    if (l.some(n => n <= LIM_MIN || n > 40)) return `Cada límite debe ser mayor que ${fmtCm(LIM_MIN)} y como máximo 40 cm.`;
    if (!(l[0] < l[1] && l[1] < l[2])) return 'Los límites deben ir de menor a mayor (MP < P < M).';
    if (l.some(n => Math.round(n * 10) !== n * 10)) return 'Usa como máximo un decimal.';
    return '';
  };
  const limPreview = () => {
    const l = limVals(); const err = limCheck(l); const el = $('#limPrev'); if (!el) return;

    const a1 = Math.round((l[0] + 0.1) * 10) / 10, b1 = Math.round((l[1] + 0.1) * 10) / 10;
    el.textContent = `MP ${fmtCm(LIM_MIN)}–${fmtCm(l[0])} · P ${fmtCm(a1)}–${fmtCm(l[1])} · M ${fmtCm(b1)}–${fmtCm(l[2])} · G >${fmtCm(l[2])} cm`;
  };

  ctx = { onChange: name => { if (/^lim\d$/.test(name)) limPreview(); } };

  $('#btnLim').addEventListener('click', async () => {

    if (l.every((n, i) => n === S.limites[i])) { toast('Los límites no cambiaron'); return; }
    const nuevo = limStr([LIM_MIN, ...l]);
    let mezcla = false;
    try { mezcla = (await DB.all('conteo')).some(r => r.ronda === S.ultimaRonda && limStr(r.limites) !== nuevo); } catch (e) { /* nada */ }
    const body = `Nuevos límites: <b>${esc(nuevo)} cm</b>.${mezcla ? `<br><br>⚠ Ya hay árboles contados en la ronda ${esc(S.ultimaRonda)} con otros límites. Cambiar a mitad de ronda mezcla clases distintas.` : ''}<br><br>Cada árbol guarda los límites con que se contó.`;
    if (!await confirmar('Cambiar límites de tamaño', body, 'Cambiar')) return;
    S.limites = l; applyLimits(); await saveSettings(); toast(`Límites guardados ✓ (${nuevo})`, 'ok');

}
async function exportBackup() {
  const data = {}; for (const s of DATA_STORES) data[s] = await DB.all(s);
  const obj = { app: 'bayacao-campo', version: APP_VERSION, fecha: new Date().toISOString(), dispositivo: S.dispositivo, registrador: S.registrador, listas: { parcelas: S.parcelas, materiales: S.materiales, estaciones: S.estaciones }, data };
  const d = new Date();
  const fname = `Bayacao_respaldo_${S.dispositivo}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  const r = await shareOrDownload(new Blob([JSON.stringify(obj)], { type: 'application/json' }), fname, 'Respaldo Bayacao campo');
  if (r !== 'aborted') toast('Respaldo generado ✓', 'ok');
}
async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { toast('El archivo no es un JSON válido', 'err'); return; }
  if (!obj || obj.app !== 'bayacao-campo' || !obj.data) { toast('No es un respaldo de esta app', 'err'); return; }
  let add = 0, upd = 0, same = 0;
  try {
    for (const s of DATA_STORES) {
      const inc = Array.isArray(obj.data[s]) ? obj.data[s].filter(r => r && r.id) : [];
      const curArr = await DB.all(s); const cur = new Map(curArr.map(r => [r.id, r])); const put = []; const delIds = [];
      if (s === 'fichas') {
        // Una ficha vigente por árbol: si el árbol ya tiene otra ficha, queda la más reciente
        const byKey = fichaMapa(curArr);
        inc.forEach(r => {
          const k = fKey(r.parcela, r.punto, r.arbol); const c = cur.get(r.id) || byKey.get(k);
          if (!c) { put.push(r); byKey.set(k, r); add++; }
          else if ((r.modificado || '') > (c.modificado || '')) { if (c.id !== r.id) delIds.push(c.id); put.push(r); byKey.set(k, r); upd++; }
          else same++;
        });
      } else inc.forEach(r => { const c = cur.get(r.id); if (!c) { put.push(r); add++; } else if ((r.modificado || '') > (c.modificado || '')) { put.push(r); upd++; } else same++; });
      await DB.putMany(s, put); await DB.delMany(s, delIds);
    }
    if (obj.listas) {
      const u = (a, b) => [...new Set([...(a || []), ...(b || [])])];
      S.parcelas = u(S.parcelas, obj.listas.parcelas); S.materiales = u(S.materiales, obj.listas.materiales); S.estaciones = u(S.estaciones, obj.listas.estaciones); await saveSettings();
    }
  } catch (e) { console.error(e); toast('Error al importar: ' + e.message, 'err'); return; }
  await modal({ title: 'Importación terminada', body: `<p>Nuevos: <b>${add}</b><br>Actualizados: <b>${upd}</b><br>Sin cambios: <b>${same}</b></p>` });
  updateStatus();
}
async function cleanExported() {
  const r = await modal({ title: 'Borrar registros ya exportados', danger: true, body: '<p>Escribe <b>BORRAR</b> para confirmar. Los registros no exportados no se tocan.</p>', input: { placeholder: 'BORRAR' }, buttons: [{ label: 'Cancelar', val: false }, { label: 'Borrar', val: true, cls: 'danger' }] });
  if (!r.val) return;
  if (r.text.trim() !== 'BORRAR') { toast('Texto incorrecto; no se borró nada', 'err'); return; }
  let n = 0;
  const delWhere = async (s, fn) => { const ids = (await DB.all(s)).filter(fn).map(x => x.id); await DB.delMany(s, ids); n += ids.length; };
  await delWhere('conteo', x => x.exportado); await delWhere('fenologia', x => x.exportado); await delWhere('clima', x => x.exportado);
  await delWhere('lotes', x => x.exportado && x.estado === 'cerrado');
  const pods = await DB.all('pods'); const live = new Set(pods.filter(p => p.estado === 0 || !p.exportado).map(p => p.id));
  const visits = await DB.all('visits');
  // Mazorcas cerradas y exportadas se borran solo si todas sus visitas ya se exportaron
  const podOk = pods.filter(p => p.exportado && p.estado !== 0 && visits.filter(v => v.podId === p.id).every(v => v.exportado));
  podOk.forEach(p => live.delete(p.id));
  await DB.delMany('pods', podOk.map(p => p.id)); n += podOk.length;
  await delWhere('visits', v => v.exportado && !live.has(v.podId));
  toast(`${n} registros exportados borrados`, 'ok'); updateStatus();
}

  c1.limites = curLim(); c2.limites = curLim();

  const fichas = await DB.all('fichas');
  const fn = [mkF(1, fv1, 'ICS-95', 'Media', 'Ejemplo de demostración'), mkF(2, fv2, 'UF-677', 'Alta', '')].filter(f => !fichaDe(fichas, f.parcela, f.punto, f.arbol));

async function clearExamples() {
  if (!await confirmar('Borrar datos de ejemplo', 'Se borrarán todos los registros con registrador «EJEMPLO».', 'Borrar', true)) return;
  let n = 0;
  for (const s of DATA_STORES) { const ids = (await DB.all(s)).filter(r => r.registrador === 'EJEMPLO').map(r => r.id); await DB.delMany(s, ids); n += ids.length; }
  toast(`${n} registros de ejemplo borrados`, 'ok'); updateStatus();
}

async function init() {
  await DB.open();
  await loadSettings();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* nada */ }
  bindGlobalEvents();
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', () => { saveDraft(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });
  if (!location.hash) history.replaceState(null, '', '#/inicio');
  await route();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW no registrado', e));
  }
}
init().catch(e => { console.error(e); $('#main').innerHTML = `<div class="card"><p class="msg err">No se pudo iniciar la app: ${esc(e.message)}</p></div>`; });
